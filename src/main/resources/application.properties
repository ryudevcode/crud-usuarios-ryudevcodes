spring.application.name=crud-usuarios-ryudevcode

# Configuracion de conexion a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/crud_usuarios_ryudevcode?serverTimezone=America/Mexico_City
spring.datasource.username=root
spring.datasource.password=admin


# Driver de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# Configuracion de Hibernate
spring.jpa.hibernate.ddl-auto=update


# Mostrar consultas SQL
spring.jpa.show-sql=true

# Formatear consultas SQL
spring.jpa.properties.hibernate.format_sql=true
